<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namaste React</title>
    <link rel="stylesheet" href="index.css" />
</head>

<body>
    <div id="container"></div>
    <div id="container1">
        <h1>
            Ujjwal is here!!!
        </h1>
    </div>

    <!-- CDN -Content Delivery Network -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="App.js"></script>
</body>

</html>

<!-- Now after importing our CDNs via script tag, our project has access to React 18 -->
<!-- Originally browsers are not able to understand and interpret React, but with the help of CDNs,
whatever code we write in React will be understood by our browsers -->
